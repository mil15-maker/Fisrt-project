<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 월간 운동 트래커</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .calendar-day {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .calendar-day:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700">

  <!-- 알림 메시지 토스트 (alert 대체) -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 1. 로그인 화면 섹션 -->
  <section id="login-section" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 sm:p-10 border border-white/20">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-3xl shadow-lg shadow-indigo-500/30 mb-4">
          <i class="fa-solid fa-dumbbell"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">나의 운동 기록장</h1>
        <p class="text-sm text-slate-500 mt-1.5">개인 운동 관리를 위해 로그인해 주세요.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">아이디</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="username" required autocomplete="username" placeholder="아이디를 입력하세요"
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">비밀번호</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required autocomplete="current-password" placeholder="비밀번호를 입력하세요"
              class="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="login-error" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-xl p-3 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>아이디 또는 비밀번호가 일치하지 않습니다.</span>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 flex items-center justify-center gap-2 text-base">
          <span>로그인</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400">테스트 계정 안내: <span class="font-mono text-slate-600 font-semibold">user</span> / <span class="font-mono text-slate-600 font-semibold">userpass</span></p>
      </div>
    </div>
  </section>

  <!-- 2. 메인 대시보드 섹션 (로그인 성공 시 표시) -->
  <div id="app-section" class="hidden flex-1 flex flex-col">
    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-fire-flame-curved"></i>
          </div>
          <span class="font-bold text-lg text-slate-900 tracking-tight">DAILY WORKOUT</span>
        </div>

        <div class="flex items-center gap-3 sm:gap-4">
          <span class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            user님 환영합니다
          </span>
          <button id="logout-btn" class="text-sm font-medium text-slate-600 hover:text-rose-600 bg-slate-100 hover:bg-rose-50 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>로그아웃</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
      
      <!-- 월간 요약 통계 카드 4종 -->
      <section aria-label="월간 운동 통계">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-indigo-600"></i>
            <span id="stats-month-title">2026년 11월 운동 달성 현황</span>
          </h2>
          <span class="text-xs text-slate-500">날짜를 클릭하여 운동 완료 여부를 체크하세요</span>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4" id="stats-cards">
          <!-- JS로 동적 렌더링 -->
        </div>
      </section>

      <!-- 캘린더 + 선택 날짜 체크리스트 그리드 -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- 왼쪽: 월단위 달력 (8컬럼) -->
        <section class="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 sm:p-6">
          <!-- 달력 네비게이션 -->
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2 sm:gap-3">
              <button id="prev-month" aria-label="이전 달" class="w-10 h-10 rounded-xl border border-slate-200 hover:bg-slate-50 active:bg-slate-100 flex items-center justify-center text-slate-600 transition">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <h3 id="current-month-label" class="text-xl sm:text-2xl font-bold text-slate-900 min-w-[140px] text-center">
                2026년 11월
              </h3>
              <button id="next-month" aria-label="다음 달" class="w-10 h-10 rounded-xl border border-slate-200 hover:bg-slate-50 active:bg-slate-100 flex items-center justify-center text-slate-600 transition">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>

            <button id="today-btn" class="px-3.5 py-2 text-sm font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition">
              오늘로 이동
            </button>
          </div>

          <!-- 요일 헤더 -->
          <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center">
            <div class="text-xs font-bold text-rose-500 py-1">일</div>
            <div class="text-xs font-bold text-slate-500 py-1">월</div>
            <div class="text-xs font-bold text-slate-500 py-1">화</div>
            <div class="text-xs font-bold text-slate-500 py-1">수</div>
            <div class="text-xs font-bold text-slate-500 py-1">목</div>
            <div class="text-xs font-bold text-slate-500 py-1">금</div>
            <div class="text-xs font-bold text-blue-500 py-1">토</div>
          </div>

          <!-- 달력 날짜 그리드 -->
          <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2.5">
            <!-- JS로 날짜 셀 생성 -->
          </div>

          <!-- 범례 -->
          <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
            <div class="flex flex-wrap items-center gap-3 sm:gap-4">
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>팔 굽혀 펴기 50회</span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>계단오르기</span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>러닝 5km</span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>스쿼트 50회</span>
            </div>
            <span class="font-medium text-indigo-600">★ 4개 모두 완료 시 올클리어 배지</span>
          </div>
        </section>

        <!-- 오른쪽: 선택된 날짜 운동 체크 패널 (4컬럼) -->
        <aside class="lg:col-span-4 bg-white rounded-3xl shadow-sm border border-slate-200/80 p-5 sm:p-6 sticky top-24">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">운동 체크리스트</span>
              <h3 id="selected-date-title" class="text-xl font-bold text-slate-900 mt-0.5">2026년 11월 25일 (수)</h3>
            </div>
            <div id="daily-progress-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">
              0 / 4 완료
            </div>
          </div>

          <!-- 프로그레스 바 -->
          <div class="mt-4 mb-6">
            <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
              <div id="daily-progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>

          <!-- 4가지 운동 체크 항목 리스트 -->
          <div id="workout-checklist" class="space-y-3">
            <!-- JS로 동적 렌더링 -->
          </div>

          <!-- 전체 완료 / 초기화 버튼 -->
          <div class="mt-6 pt-4 border-t border-slate-100 flex gap-2">
            <button id="complete-all-btn" class="flex-1 py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition shadow-sm">
              모두 완료 체크
            </button>
            <button id="reset-day-btn" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-xl transition">
              초기화
            </button>
          </div>
        </aside>

      </div>
    </main>
  </div>

  <script>
    /**
     * 나의 월간 운동 트래커 애플리케이션 로직
     * - 인증: user / userpass
     * - 운동 종목: 팔 굽혀 펴기 50회, 계단오르기, 러닝 5km, 스쿼트 50회
     * - 상태 관리: 인메모리 상태 + 샘플 초기 데이터 제공 (이번 달 운동 기록 시연용)
     */

    // 1. 운동 종목 정의
    const WORKOUT_TYPES = [
      {
        id: 'pushup',
        name: '팔 굽혀 펴기 50회',
        desc: '상체 근력 및 코어 강화',
        icon: 'fa-solid fa-child-reaching',
        colorClass: 'blue',
        dotBg: 'bg-blue-500',
        badgeBg: 'bg-blue-50 text-blue-700 border-blue-200',
        activeCard: 'border-blue-500 bg-blue-50/40'
      },
      {
        id: 'stairs',
        name: '계단오르기',
        desc: '하체 근력 및 유산소 운동',
        icon: 'fa-solid fa-stairs',
        colorClass: 'emerald',
        dotBg: 'bg-emerald-500',
        badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        activeCard: 'border-emerald-500 bg-emerald-50/40'
      },
      {
        id: 'running',
        name: '러닝 5km',
        desc: '심폐 지구력 향상 조깅/러닝',
        icon: 'fa-solid fa-person-running',
        colorClass: 'amber',
        dotBg: 'bg-amber-500',
        badgeBg: 'bg-amber-50 text-amber-700 border-amber-200',
        activeCard: 'border-amber-500 bg-amber-50/40'
      },
      {
        id: 'squat',
        name: '스쿼트 50회',
        desc: '하체 대근육 및 균형 강화',
        icon: 'fa-solid fa-dumbbell',
        colorClass: 'purple',
        dotBg: 'bg-purple-500',
        badgeBg: 'bg-purple-50 text-purple-700 border-purple-200',
        activeCard: 'border-purple-500 bg-purple-50/40'
      }
    ];

    // 2. 애플리케이션 상태
    const today = new Date();
    const state = {
      isAuthenticated: false,
      currentYear: today.getFullYear(),
      currentMonth: today.getMonth(), // 0-indexed (0 = 1월)
      selectedDateStr: formatDateKey(today),
      // 날짜별 운동 완료 데이터: { 'YYYY-MM-DD': { pushup: true, stairs: false, ... } }
      records: {}
    };

    // 날짜를 'YYYY-MM-DD' 포맷 문자열로 변환
    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 초기 샘플 데이터 생성 (사용자가 바로 월간 통계를 체감할 수 있도록 오늘 이전 며칠간 샘플 기록 세팅)
    function initSampleData() {
      const y = today.getFullYear();
      const m = today.getMonth();
      const currentDay = today.getDate();

      for (let d = 1; d < currentDay; d++) {
        // 일부 날짜에 샘플 데이터 부여
        if (d % 2 === 1 || d % 3 === 0) {
          const dateKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          state.records[dateKey] = {
            pushup: d % 2 === 1,
            stairs: d % 3 === 0 || d % 4 === 1,
            running: d % 4 === 1,
            squat: d % 2 === 1 || d % 3 === 0
          };
        }
      }
    }

    // 토스트 알림 표시 함수
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-slate-900 text-white' : 'bg-rose-600 text-white';
      const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-white';

      toast.className = `${bgColor} px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5 text-sm font-medium transform transition-all duration-300 translate-y-0 opacity-100`;
      toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // 3. 로그인 / 로그아웃 로직
    const loginSection = document.getElementById('login-section');
    const appSection = document.getElementById('app-section');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const togglePwBtn = document.getElementById('toggle-pw');
    const passwordInput = document.getElementById('password');

    // 비밀번호 보기 토글
    togglePwBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePwBtn.innerHTML = isPassword
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';
    });

    // 로그인 제출 이벤트
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const usernameVal = document.getElementById('username').value.trim();
      const passwordVal = passwordInput.value.trim();

      if (usernameVal === 'user' && passwordVal === 'userpass') {
        state.isAuthenticated = true;
        loginError.classList.add('hidden');
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        renderAll();
        showToast('로그인되었습니다. 오늘도 득근하세요!');
      } else {
        loginError.classList.remove('hidden');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });

    // 로그아웃 이벤트
    document.getElementById('logout-btn').addEventListener('click', () => {
      state.isAuthenticated = false;
      appSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      document.getElementById('username').value = '';
      passwordInput.value = '';
      loginError.classList.add('hidden');
      showToast('안전하게 로그아웃되었습니다.');
    });

    // 4. 월간 통계 렌더링
    function renderStats() {
      const year = state.currentYear;
      const month = state.currentMonth;
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      document.getElementById('stats-month-title').textContent = `${year}년 ${month + 1}월 운동 달성 현황`;

      // 종목별 완료 횟수 계산
      const counts = { pushup: 0, stairs: 0, running: 0, squat: 0 };
      Object.keys(state.records).forEach(dateKey => {
        if (dateKey.startsWith(monthPrefix)) {
          const dayData = state.records[dateKey];
          WORKOUT_TYPES.forEach(w => {
            if (dayData && dayData[w.id]) {
              counts[w.id]++;
            }
          });
        }
      });

      const statsContainer = document.getElementById('stats-cards');
      statsContainer.innerHTML = WORKOUT_TYPES.map(w => {
        const count = counts[w.id];
        const percentage = Math.round((count / daysInMonth) * 100);
        return `
          <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm flex flex-col justify-between">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-xs font-semibold text-slate-500 block">${w.name}</span>
                <div class="mt-1.5 flex items-baseline gap-1.5">
                  <span class="text-2xl sm:text-3xl font-extrabold text-slate-900">${count}</span>
                  <span class="text-xs font-medium text-slate-400">/ ${daysInMonth}일</span>
                </div>
              </div>
              <div class="w-10 h-10 rounded-xl ${w.badgeBg} border flex items-center justify-center text-base shrink-0">
                <i class="${w.icon}"></i>
              </div>
            </div>
            <div class="mt-4">
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-400">월간 달성률</span>
                <span class="font-bold text-slate-700">${percentage}%</span>
              </div>
              <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full ${w.dotBg} rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. 월간 달력 렌더링
    function renderCalendar() {
      const year = state.currentYear;
      const month = state.currentMonth;

      document.getElementById('current-month-label').textContent = `${year}년 ${month + 1}월`;

      const firstDayIndex = new Date(year, month, 1).getDay(); // 0(일) ~ 6(토)
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDateKey(today);

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      // 이전 달 빈 칸 채우기
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-20 sm:h-24 rounded-2xl bg-slate-50/50 border border-transparent';
        grid.appendChild(emptyCell);
      }

      // 실제 날짜 셀 생성
      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = formatDateKey(dateObj);
        const dayOfWeek = dateObj.getDay();
        const isSelected = dateKey === state.selectedDateStr;
        const isToday = dateKey === todayStr;

        const dayRecord = state.records[dateKey] || {};
        const completedWorkouts = WORKOUT_TYPES.filter(w => dayRecord[w.id]);
        const isAllClear = completedWorkouts.length === WORKOUT_TYPES.length;

        const cell = document.createElement('button');
        cell.type = 'button';

        // 날짜 숫자 색상
        let numColor = 'text-slate-700';
        if (dayOfWeek === 0) numColor = 'text-rose-500';
        else if (dayOfWeek === 6) numColor = 'text-blue-500';

        // 셀 테두리 및 배경 스타일
        let cellStyle = 'bg-white border-slate-200/80 hover:border-indigo-300 hover:shadow-sm';
        if (isSelected) {
          cellStyle = 'bg-indigo-50/70 border-indigo-600 ring-2 ring-indigo-600/20 shadow-sm';
        } else if (isAllClear) {
          cellStyle = 'bg-emerald-50/40 border-emerald-200 hover:border-emerald-400';
        }

        cell.className = `calendar-day h-20 sm:h-24 rounded-2xl border p-1.5 sm:p-2.5 flex flex-col justify-between text-left relative focus:outline-none ${cellStyle}`;

        // 상단: 날짜 숫자 및 오늘/올클리어 표시
        const topRow = document.createElement('div');
        topRow.className = 'w-full flex items-center justify-between';

        const daySpan = document.createElement('span');
        daySpan.className = `text-xs sm:text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full ${
          isToday ? 'bg-indigo-600 text-white' : numColor
        }`;
        daySpan.textContent = day;
        topRow.appendChild(daySpan);

        if (isAllClear) {
          const starBadge = document.createElement('span');
          starBadge.className = 'text-amber-400 text-xs sm:text-sm';
          starBadge.title = '모든 운동 완료!';
          starBadge.innerHTML = '<i class="fa-solid fa-star"></i>';
          topRow.appendChild(starBadge);
        }

        cell.appendChild(topRow);

        // 하단: 완료된 운동 컬러 도트 / 미니 태그
        const bottomArea = document.createElement('div');
        bottomArea.className = 'w-full flex flex-wrap gap-1 mt-auto';

        WORKOUT_TYPES.forEach(w => {
          const done = !!dayRecord[w.id];
          const dot = document.createElement('span');
          dot.className = `h-2 flex-1 rounded-full transition-all ${
            done ? w.dotBg : 'bg-slate-100'
          }`;
          dot.title = `${w.name}: ${done ? '완료' : '미완료'}`;
          bottomArea.appendChild(dot);
        });

        cell.appendChild(bottomArea);

        // 날짜 클릭 시 해당 날짜 선택
        cell.addEventListener('click', () => {
          state.selectedDateStr = dateKey;
          renderCalendar();
          renderChecklist();
        });

        grid.appendChild(cell);
      }
    }

    // 6. 우측 선택 날짜 운동 체크리스트 렌더링
    function renderChecklist() {
      const [y, m, d] = state.selectedDateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = weekNames[dateObj.getDay()];

      document.getElementById('selected-date-title').textContent = `${y}년 ${m}월 ${d}일 (${dayName})`;

      const dayRecord = state.records[state.selectedDateStr] || {};
      const completedCount = WORKOUT_TYPES.filter(w => dayRecord[w.id]).length;
      const progressPercent = (completedCount / WORKOUT_TYPES.length) * 100;

      // 상단 배지 및 프로그레스 바 업데이트
      const badge = document.getElementById('daily-progress-badge');
      badge.textContent = `${completedCount} / ${WORKOUT_TYPES.length} 완료`;
      if (completedCount === WORKOUT_TYPES.length) {
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700';
      } else if (completedCount > 0) {
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700';
      } else {
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600';
      }

      document.getElementById('daily-progress-bar').style.width = `${progressPercent}%`;

      // 체크리스트 항목 렌더링
      const listContainer = document.getElementById('workout-checklist');
      listContainer.innerHTML = WORKOUT_TYPES.map(w => {
        const isChecked = !!dayRecord[w.id];
        return `
          <label class="cursor-pointer block select-none">
            <input type="checkbox" class="sr-only" data-workout-id="${w.id}" ${isChecked ? 'checked' : ''}>
            <div class="p-3.5 rounded-2xl border-2 transition-all flex items-center justify-between gap-3 ${
              isChecked
                ? `${w.activeCard} shadow-sm`
                : 'border-slate-100 bg-slate-50/70 hover:border-slate-200 hover:bg-white'
            }">
              <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-base transition-colors ${
                  isChecked ? `${w.dotBg} text-white shadow-sm` : 'bg-white text-slate-400 border border-slate-200'
                }">
                  <i class="${w.icon}"></i>
                </div>
                <div>
                  <div class="font-bold text-sm sm:text-base ${isChecked ? 'text-slate-900' : 'text-slate-700'}">
                    ${w.name}
                  </div>
                  <div class="text-xs text-slate-500 mt-0.5">${w.desc}</div>
                </div>
              </div>

              <div class="w-6 h-6 rounded-full flex items-center justify-center border-2 transition-all shrink-0 ${
                isChecked
                  ? 'bg-indigo-600 border-indigo-600 text-white'
                  : 'border-slate-300 bg-white text-transparent'
              }">
                <i class="fa-solid fa-check text-xs"></i>
              </div>
            </div>
          </label>
        `;
      }).join('');

      // 체크박스 이벤트 바인딩
      listContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const workoutId = e.target.dataset.workoutId;
          if (!state.records[state.selectedDateStr]) {
            state.records[state.selectedDateStr] = {};
          }
          state.records[state.selectedDateStr][workoutId] = e.target.checked;
          renderAll();
        });
      });
    }

    // 전체 UI 갱신
    function renderAll() {
      renderStats();
      renderCalendar();
      renderChecklist();
    }

    // 7. 달력 이동 및 일괄 버튼 이벤트
    document.getElementById('prev-month').addEventListener('click', () => {
      state.currentMonth--;
      if (state.currentMonth < 0) {
        state.currentMonth = 11;
        state.currentYear--;
      }
      renderStats();
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      state.currentMonth++;
      if (state.currentMonth > 11) {
        state.currentMonth = 0;
        state.currentYear++;
      }
      renderStats();
      renderCalendar();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
      const now = new Date();
      state.currentYear = now.getFullYear();
      state.currentMonth = now.getMonth();
      state.selectedDateStr = formatDateKey(now);
      renderAll();
    });

    document.getElementById('complete-all-btn').addEventListener('click', () => {
      if (!state.records[state.selectedDateStr]) {
        state.records[state.selectedDateStr] = {};
      }
      WORKOUT_TYPES.forEach(w => {
        state.records[state.selectedDateStr][w.id] = true;
      });
      renderAll();
      showToast('선택한 날짜의 모든 운동을 완료했습니다!');
    });

    document.getElementById('reset-day-btn').addEventListener('click', () => {
      delete state.records[state.selectedDateStr];
      renderAll();
      showToast('해당 날짜의 기록이 초기화되었습니다.');
    });

    // 초기화 실행
    initSampleData();
  </script>
</body>
</html>
